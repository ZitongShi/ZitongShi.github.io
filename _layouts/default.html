<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="{{ page.description | default: site.description | escape }}"
    >
    <title>{{ page.title | default: site.title }}</title>
    <link rel="icon" href="{{ '/assets/img/favicon.ico' | relative_url }}" sizes="any">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  </head>
  <body>
    <button class="menu-button" type="button" aria-controls="sidebar" aria-expanded="false">
      <span aria-hidden="true">☰</span>
      <span class="sr-only">Open navigation</span>
    </button>

    <aside class="sidebar" id="sidebar">
      <div class="profile">
        <img
          class="profile-avatar"
          src="{{ '/assets/img/avatar.jpg' | relative_url }}"
          alt="Portrait of Zitong Shi"
        >
        <p class="profile-name">Zitong Shi</p>
        <p class="profile-role">PhD Student @ NUS</p>
        <a class="profile-email" href="mailto:zitongshi@whu.edu.cn">zitongshi@whu.edu.cn</a>
      </div>

      <nav aria-label="Primary navigation">
        <ol class="nav-list">
          <li><a href="#about">About</a></li>
          <li><a href="#research">Research</a></li>
          <li><a href="#news">News</a></li>
          <li><a href="#publications">Publications</a></li>
          <li><a href="#experience">Experience</a></li>
          <li><a href="#service">Service</a></li>
          <li><a href="#education">Education</a></li>
        </ol>
      </nav>

      <div class="profile-links" aria-label="Profile links">
        <a href="https://github.com/ZitongShi" target="_blank" rel="noreferrer">GitHub</a>
        <a
          href="https://scholar.google.com/citations?user=gB8FS0MAAAAJ"
          target="_blank"
          rel="noreferrer"
        >Scholar</a>
      </div>
    </aside>

    <main class="main-content">
      {{ content }}
    </main>
  </body>
</html>
